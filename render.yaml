services:
  - type: web
    name: interviewai-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .              # ← ROOT, not ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: interviewai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: 8002

databases:
  - name: interviewai-db
    plan: free
    databaseName: interviewai
    user: interviewai