services:
  - type: web
    name: interviewai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: interviewai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # We will restrict this later

databases:
  - name: interviewai-db
    plan: free
    databaseName: interviewai
    user: interviewai