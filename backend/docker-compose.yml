services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env.example
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://interviewai:interviewai@postgres:5432/interviewai
      JWT_SECRET: compose-development-only-change-me
      LLM_PROVIDER: mock
      STORAGE_ENDPOINT: ""
      STORAGE_ACCESS_KEY: ""
      STORAGE_SECRET_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interviewai
      POSTGRES_USER: interviewai
      POSTGRES_PASSWORD: interviewai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewai -d interviewai"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  storage:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-long-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
volumes:
  postgres_data:
  storage_data:
